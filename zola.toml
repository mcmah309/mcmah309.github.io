base_url = "https://mcmah309.github.io"
title = "mcmah309 Blog"
description = "Tech talk and ongoing open source projects"
default_language = "en"
compile_sass = false
build_search_index = true
generate_feeds = true
feed_filenames = ["feed.xml"]
taxonomies = [
    { name = "categories", feed = false },
    { name = "tags", feed = false },
]

[markdown]
smart_punctuation = true

[markdown.highlighting]
theme = "so-simple"
extra_themes = ["syntax/so-simple.json"]

[search]
index_format = "elasticlunr_javascript"

[extra]
author = "Dillon McMahon"
navigation = [
    { title = "Home", url = "/" },
    { title = "Posts", url = "/posts/" },
    { title = "Categories", url = "/categories/" },
    { title = "Tags", url = "/tags/" },
    { title = "Search", url = "/search/" },
]
