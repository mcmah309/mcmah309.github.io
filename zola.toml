base_url = "https://mcmah309.github.io"
title = "mcmah309 Blog"
description = "Notes on Rust, software, and open source"
default_language = "en"
compile_sass = false
build_search_index = true
generate_feeds = true
feed_filenames = ["feed.xml"]
taxonomies = [
    { name = "tags", feed = false },
]

[markdown]
smart_punctuation = true

[markdown.highlighting]
theme = "github-dark"

[search]
index_format = "elasticlunr_javascript"

[extra]
author = "Dillon McMahon"
navigation = [
    { title = "Home", url = "@/_index.md" },
    { title = "Posts", url = "@/posts/_index.md" },
    { title = "Tags", url = "tags/" },
    { title = "Search", url = "@/search/_index.md" },
]
