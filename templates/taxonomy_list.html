{% extends "base.html" %}
{% block settings %}{% set layout = taxonomy.name %}{% endblock settings %}
{% block content %}
<ul class="taxonomy-index">
{% for term in terms %}
<li id="{{ term.slug }}"><a href="{{ term.permalink }}"><strong>{{ term.name }}</strong> <span class="taxonomy-count">{{ term.pages | length }}</span></a></li>
{% endfor %}
</ul>
{% endblock content %}
